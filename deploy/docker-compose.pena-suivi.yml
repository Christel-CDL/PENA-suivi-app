# Projet Docker « pena-suivi » (hPanel → VPS → Docker), séparé du projet « root » depuis le 14/10/2026.
# Un « Deploy » ici ne met à jour QUE l'application de suivi : n8n et Traefik (projet root) ne sont pas touchés.
# Rejoint le réseau de Traefik (root_default), sur le modèle du projet app-constats.
#
# Variables à renseigner dans la section « Environnement » du projet (copier les valeurs depuis le projet root) :
#   DOMAIN_NAME, PENA_SUBDOMAIN, PENA_AIRTABLE_PAT, PENA_AUTH_SECRET,
#   PENA_SMTP_HOST, PENA_SMTP_PORT, PENA_SMTP_USER, PENA_SMTP_PASS, PENA_SMTP_FROM
# Jamais de valeur secrète dans ce fichier (il est versionné dans Git).
services:
  pena-app:
    image: ghcr.io/christel-cdl/pena-suivi-app:latest
    restart: always
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      # Nom de routeur différent de l'ancien (« pena-app » dans root) : les deux peuvent coexister
      # pendant la bascule, sans conflit dans Traefik ni coupure.
      - "traefik.http.routers.pena-suivi.rule=Host(`${PENA_SUBDOMAIN}.${DOMAIN_NAME}`)"
      - "traefik.http.routers.pena-suivi.tls=true"
      - "traefik.http.routers.pena-suivi.entrypoints=web,websecure"
      - "traefik.http.routers.pena-suivi.tls.certresolver=mytlschallenge"
      - "traefik.http.services.pena-suivi.loadbalancer.server.port=3000"
    environment:
      - AIRTABLE_PAT=${PENA_AIRTABLE_PAT}
      - AUTH_SECRET=${PENA_AUTH_SECRET}
      - APP_URL=https://${PENA_SUBDOMAIN}.${DOMAIN_NAME}
      - SMTP_HOST=${PENA_SMTP_HOST}
      - SMTP_PORT=${PENA_SMTP_PORT}
      - SMTP_USER=${PENA_SMTP_USER}
      - SMTP_PASS=${PENA_SMTP_PASS}
      - SMTP_FROM=${PENA_SMTP_FROM}

networks:
  root_default:
    external: true
